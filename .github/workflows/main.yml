name: main
env:
  GOEXPERIMENT: cgocheck2
on:
  pull_request:
  push:
    branches:
    - master
    tags:
    - v*
jobs:
  main:
    runs-on: ubuntu-24.04
    steps:
    - name: install-dependencies
      run: |
        sudo apt-get install -y libproj-dev
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7.0.0
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16   # v6.5.0
    - name: Test
      run: go test -race ./...
  lint:
    runs-on: ubuntu-22.04
    steps:
    - name: install-dependencies
      run: |
        sudo apt-get install -y libproj-dev
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7.0.0
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16   # v6.5.0
    - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee   # v9.2.1
      with:
        version: v2.12.2
  proj-versions:
    strategy:
      fail-fast: false
      matrix:
        proj-version:
        - 9.4.0 # Used in Ubuntu 24.04 LTS
        - 9.7.1 # Used in Ubuntu 26.04 LTS
        - 9.8.1 # Latest 9.8.x
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
      id: cache-proj
      with:
        path: ~/work/proj-${{ matrix.proj-version }}
        key: ${{ runner.os }}-proj-${{ matrix.proj-version }}
    - name: install-build-dependencies
      run: |
        sudo apt-get install -y libcurl4-gnutls-dev libsqlite3-dev libtiff-dev sqlite3
    - name: build-proj
      if: ${{ steps.cache-proj.outputs.cache-hit != 'true' }}
      run: |
        cd ~/work
        curl https://download.osgeo.org/proj/proj-${{ matrix.proj-version }}.tar.gz | tar xzf -
        cd proj-${{ matrix.proj-version }}
        mkdir build
        cd build
        cmake ..
        cmake --build . -j 4
        ctest
    - name: install-proj
      run: |
        cd ~/work/proj-${{ matrix.proj-version }}/build
        sudo make install
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e   # v7.0.0
      with:
        go-version: stable
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    - name: test
      run: |
        sudo ldconfig
        go test ./...
